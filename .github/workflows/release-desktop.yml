name: Release desktop apps

# Tag `v1.2.3` (the version must match package.json) to publish a draft release
# with the macOS and Windows installers attached. The Windows job also ships a
# portable zip, which is what the app's own update notes point people at.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  TIEZ_RELEASE_CHANNEL: stable

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            label: macOS arm64
            platform: macos
            artifact: jn-clipboard-macos-arm64
            bundles: dmg,app
          - os: macos-15-intel
            label: macOS x64
            platform: macos
            artifact: jn-clipboard-macos-x64
            bundles: dmg,app
          - os: windows-latest
            label: Windows x64
            platform: windows
            artifact: jn-clipboard-windows-x64
            bundles: nsis,msi

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build installers
        run: node scripts/build-release.mjs ${{ matrix.platform }} stable --bundles ${{ matrix.bundles }}

      - name: Build portable zip
        if: matrix.platform == 'windows'
        run: npm run build:portable

      - name: Upload macOS bundles
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: Upload Windows bundles
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload portable zip
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: jn-clipboard-windows-x64-portable
          if-no-files-found: error
          retention-days: 7
          path: artifacts/portable/jn-clipboard-portable.zip

  publish:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Collect installers
        run: |
          mkdir -p assets
          find dist -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.zip' \) \
            -exec mv -n {} assets/ \;
          ls -la assets
          test -n "$(ls -A assets)" || { echo "::error::No installers were built"; exit 1; }

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "jn-clipboard $TAG" \
            --notes "Unsigned builds: macOS asks you to allow the app under System Settings → Privacy & Security, and Windows SmartScreen warns on first launch." \
            assets/*
